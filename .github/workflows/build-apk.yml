name: Build APK<br/><br/>on:<br/>  push:<br/>    branches: [main]<br/>  workflow_dispatch:<br/><br/>jobs:<br/>  build:<br/>    runs-on: ubuntu-latest<br/>    steps:<br/>      - uses: actions/checkout@v4<br/><br/>      - name: Set up JDK 17<br/>        uses: actions/setup-java@v4<br/>        with:<br/>          distribution: temurin<br/>          java-version: 17<br/>          cache: gradle<br/><br/>      - name: Make gradlew executable<br/>        run: chmod +x gradlew<br/><br/>      - name: Build debug APK<br/>        run: ./gradlew assembleDebug --no-daemon<br/><br/>      - name: Upload APK<br/>        uses: actions/upload-artifact@v4<br/>        with:<br/>          name: debug-apk<br/>          path: app/build/outputs/apk/debug/*.apk
